<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/k-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/styles/style.css" rel="stylesheet">
    <title>Admin Sign in — KDT</title>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
      <div class="w-full max-w-md bg-white border border-gray-200 rounded-lg shadow-sm p-6 sm:p-8">
        <h1 class="text-xl font-bold text-gray-900 mb-1">Admin Sign in</h1>
        <p class="text-xs text-gray-500 mb-6">Restricted area. Authorized personnel only.</p>

        <p id="auth-status" class="text-xs sm:text-sm mb-3 hidden"></p>

        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input name="email" type="email" required autocomplete="username" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-gray-300" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <div class="relative">
              <input name="password" type="password" required minlength="8" autocomplete="current-password" class="w-full px-3 py-2 pr-10 text-sm border border-gray-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-gray-300" />
              <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700">
                <svg class="w-4 h-4 eye-open" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="w-4 h-4 eye-closed hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 01-4.24-4.24M1 1l22 22"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="w-full bg-black text-white py-2.5 rounded-md text-sm font-semibold hover:bg-gray-800 transition disabled:opacity-60">Sign in</button>
        </form>
      </div>
    </main>

    <script type="module" src="./pages/loginPage.js"></script>
  </body>
</html>
