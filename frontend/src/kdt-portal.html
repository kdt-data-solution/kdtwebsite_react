<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/k-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/styles/style.css" rel="stylesheet">
    <title>KDT Admin Sign in</title>
  </head>
  <body class="bg-[#0b0b0b] min-h-screen">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 border border-white/20">
        <section class="bg-[#0b0b0b] text-white p-8 sm:p-10 md:p-12 flex flex-col justify-between min-h-64">
          <img src="/assets/images/kdt-black.png" alt="KDT Network and Data Solution" class="h-9 w-auto self-start" />
          <div class="mt-16">
            <p class="kdt-eyebrow text-gray-400 mb-3">Secure access</p>
            <h1 class="text-3xl sm:text-4xl font-semibold leading-tight">KDT Administration</h1>
            <p class="text-sm text-gray-400 mt-4 max-w-sm">Manage inquiries, project content, media, products, services, and site settings.</p>
          </div>
        </section>
        <section class="bg-white p-8 sm:p-10 md:p-12 flex flex-col justify-center">
        <h2 class="text-2xl font-semibold text-gray-950 mb-1">Admin sign in</h2>
        <p class="text-sm text-gray-600 mb-7">Restricted area. Authorized personnel only.</p>

        <p id="auth-status" class="text-xs sm:text-sm mb-3 hidden"></p>

        <form id="login-form" class="space-y-4">
          <div>
            <label for="admin-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="admin-email" name="email" type="email" required autocomplete="username" class="w-full px-4 py-3 text-sm border border-gray-400 rounded-none bg-white focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2" />
          </div>
          <div>
            <label for="admin-password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <div class="relative">
              <input id="admin-password" name="password" type="password" required minlength="8" autocomplete="current-password" class="w-full px-4 py-3 pr-11 text-sm border border-gray-400 rounded-none bg-white focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2" />
              <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700" aria-label="Show or hide password">
                <svg class="w-4 h-4 eye-open" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="w-4 h-4 eye-closed hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 01-4.24-4.24M1 1l22 22"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="kdt-btn kdt-btn-dark w-full disabled:opacity-60">Sign in</button>
        </form>
        </section>
      </div>
    </main>

    <script type="module" src="./pages/loginPage.js"></script>
  </body>
</html>
