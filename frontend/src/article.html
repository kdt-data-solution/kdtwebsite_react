<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/k-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/styles/style.css" rel="stylesheet">
    <title>KDT Articles</title>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="KDT Network and Data Solution" />
    <meta property="og:title" id="og-title" content="KDT Articles" />
    <meta property="og:description" id="og-description" content="Read the latest editorial from KDT Network and Data Solution." />
    <meta property="og:image" id="og-image" content="" />
    <meta property="og:url" id="og-url" content="" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" id="tw-title" content="KDT Articles" />
    <meta name="twitter:description" id="tw-description" content="Read the latest editorial from KDT Network and Data Solution." />
    <meta name="twitter:image" id="tw-image" content="" />
  </head>
  <body class="min-h-screen flex flex-col">
    <div id="navbar"></div>
    <script type="module" src="./components/navbar.js"></script>

    <div id="article-page" class="flex-1"></div>
    <script type="module" src="./pages/articlePage.js"></script>

    <div id="footer"></div>
    <script type="module" src="./components/footer.js"></script>
  </body>
</html>
